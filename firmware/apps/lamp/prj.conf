# Logging
CONFIG_LOG=y

# hiot core + capabilities
CONFIG_HIOT_CORE=y
CONFIG_HIOT_DEVICE_TYPE="lamp"
CONFIG_HIOT_CAP_SWITCH=y
CONFIG_HIOT_CAP_BRIGHTNESS=y
