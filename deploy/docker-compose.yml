# Home server stack. Run on the home box (Raspberry Pi / mini PC):
#   cp .env.example .env                                  # then edit
#   ../tools/certs/mkcerts.sh ca                          # once, on your PC
#   ../tools/certs/mkcerts.sh broker <broker-name-or-ip>  # writes mosquitto/certs/
#   docker compose up -d
#
# Postgres is never exposed. The broker is exposed only as MQTT over TLS (8883).

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Devices connect over TLS only. Plain 1883 stays inside the docker network.
      - "8883:8883"
      # First firmware bring-up only, remove before pairing:
      # - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/certs:/mosquitto/config/certs:ro
      - mosquitto-data:/mosquitto/data

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # backend:   (step 6 - language/framework not decided yet)
  # nginx:     (step 7 - serves the SPA, proxies /api and /ws to backend)

volumes:
  mosquitto-data:
  postgres-data:
