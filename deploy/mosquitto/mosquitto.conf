# Mosquitto for ola-home. See docs/spec/server.md §12.1.

per_listener_settings false
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Max MQTT packet: device payloads are limited to 8 KB (spec §5.2).
max_packet_size 16384

# Nobody connects without a username/password.
allow_anonymous false

# Per-device / per-service credentials. Create with:
#   docker compose run --rm mosquitto mosquitto_passwd -c /mosquitto/config/passwd <user>
# (the passwd file is git-ignored).
# Will move to the dynamic security plugin when pairing is implemented (spec §7).
password_file /mosquitto/config/passwd

# --- TLS listener: devices and anything outside the server -------------------
# Certificates come from tools/certs/mkcerts.sh (git-ignored).
listener 8883
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/broker.crt
keyfile /mosquitto/config/certs/broker.key
# Minimum TLS version.
tls_version tlsv1.2

# --- Plain listener: only inside the docker network (backend) ---------------
# NOT published in docker-compose.yml. For the very first firmware bring-up
# you may temporarily publish 1883 on the LAN; remove that before pairing.
listener 1883
protocol mqtt

# TODO: ACLs so each device can only use hiot/<its id>/# (dynsec, spec §5.1)
