persistence true
persistence_location /mosquitto/data/

listener 1883
allow_anonymous false

# Per-device / per-service credentials. Create with:
#   docker compose run --rm mosquitto mosquitto_passwd -c /mosquitto/config/passwd <user>
# (or generate locally; the passwd file is git-ignored)
password_file /mosquitto/config/passwd

